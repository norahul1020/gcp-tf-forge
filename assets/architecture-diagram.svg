<svg width="980" height="420" viewBox="0 0 980 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="420" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />
  
  <text x="490" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    gcp-tf-forge End-to-End System Architecture
  </text>
  <text x="490" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">
    From Live Google Cloud Assets to Validated, Pristine Modular Terraform HCL
  </text>

  <!-- Stage 1: Discovery -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="160" height="260" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="40" rx="10" fill="#0369a1" />
    <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. DISCOVERY</text>
    
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#38bdf8">▶ Pre-flight Doctor</text>
    <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Read-Only Auditing</text>
    <text x="15" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Zero Secret Read</text>

    <text x="15" y="135" font-family="monospace" font-size="11" fill="#38bdf8">▶ Hierarchy Lineage</text>
    <text x="15" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Org / Folder Trees</text>
    <text x="15" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Standalone Safe</text>

    <text x="15" y="200" font-family="monospace" font-size="11" fill="#38bdf8">▶ CAI 1-Shot Scan</text>
    <text x="15" y="220" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Direct API Crawler</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Localhost Emulator</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 200 230 L 225 230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage 2: Topology DAG -->
  <g transform="translate(225, 100)" filter="url(#cardShadow)">
    <rect width="160" height="260" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="40" rx="10" fill="#4338ca" />
    <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. TOPOLOGY DAG</text>

    <text x="15" y="70" font-family="monospace" font-size="11" fill="#818cf8">▶ Graph Resolver</text>
    <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Subnet ➔ VPC</text>
    <text x="15" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">  • NodePool ➔ GKE</text>

    <text x="15" y="135" font-family="monospace" font-size="11" fill="#818cf8">▶ Ephemeral Filter</text>
    <text x="15" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Drops dynamic VMs</text>
    <text x="15" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Keeps MIG/Templates</text>

    <text x="15" y="200" font-family="monospace" font-size="11" fill="#818cf8">▶ Shared VPC</text>
    <text x="15" y="220" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Host project subnets</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Emits data sources</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 385 230 L 410 230" stroke="#818cf8" stroke-width="2" />

  <!-- Stage 3: Module Matcher -->
  <g transform="translate(410, 100)" filter="url(#cardShadow)">
    <rect width="160" height="260" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="40" rx="10" fill="#7e22ce" />
    <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. MODULE ENGINE</text>

    <text x="15" y="70" font-family="monospace" font-size="11" fill="#c084fc">▶ 3-Tier Priority</text>
    <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">  1. User Custom AST</text>
    <text x="15" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">  2. Google Official</text>
    <text x="15" y="120" font-family="sans-serif" font-size="10" fill="#94a3b8">  3. Clean Raw HCL</text>

    <text x="15" y="150" font-family="monospace" font-size="11" fill="#c084fc">▶ Field Adapters</text>
    <text x="15" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">  • name ➔ subnet_name</text>
    <text x="15" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">  • ip_range ➔ subnet_ip</text>

    <text x="15" y="215" font-family="monospace" font-size="11" fill="#c084fc">▶ Index Resolver</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#94a3b8">  • ${region}/${name}</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 570 230 L 595 230" stroke="#c084fc" stroke-width="2" />

  <!-- Stage 4: HCL2 Emitter -->
  <g transform="translate(595, 100)" filter="url(#cardShadow)">
    <rect width="160" height="260" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="40" rx="10" fill="#be123c" />
    <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4. HCL2 EMITTER</text>

    <text x="15" y="70" font-family="monospace" font-size="11" fill="#f43f5e">▶ Domain Isolation</text>
    <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">  • networking.tf</text>
    <text x="15" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">  • compute.tf</text>
    <text x="15" y="120" font-family="sans-serif" font-size="10" fill="#94a3b8">  • storage.tf</text>

    <text x="15" y="150" font-family="monospace" font-size="11" fill="#f43f5e">▶ *.auto.tfvars</text>
    <text x="15" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Zero -var-file flags</text>
    <text x="15" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">  • 100% metadata</text>

    <text x="15" y="215" font-family="monospace" font-size="11" fill="#f43f5e">▶ Safety Shields</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#94a3b8">  • DB password ignore</text>
  </g>

  <!-- Connector 4 -->
  <path d="M 755 230 L 780 230" stroke="#f43f5e" stroke-width="2" />

  <!-- Stage 5: Verification & Cleanup -->
  <g transform="translate(780, 100)" filter="url(#cardShadow)">
    <rect width="160" height="260" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="40" rx="10" fill="#047857" />
    <text x="80" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5. VERIFY &amp; CLEAN</text>

    <text x="15" y="70" font-family="monospace" font-size="11" fill="#10b981">▶ Verification</text>
    <text x="15" y="90" font-family="sans-serif" font-size="10" fill="#94a3b8">  • terraform validate</text>
    <text x="15" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">  • 0-drift plan check</text>

    <text x="15" y="135" font-family="monospace" font-size="11" fill="#10b981">▶ CIS Audit Report</text>
    <text x="15" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8">  • COMPLIANCE_AUDIT.md</text>
    <text x="15" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">  • CIS GCP Benchmark</text>

    <text x="15" y="200" font-family="monospace" font-size="11" fill="#10b981">▶ Auto-Pruner</text>
    <text x="15" y="220" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Prunes *_imports.tf</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#94a3b8">  • Clean Git commit</text>
  </g>
</svg>
