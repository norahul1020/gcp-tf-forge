<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gcpGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#FBBC05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 65 L 1000 65 M 0 130 L 1000 130 M 0 195 L 1000 195" stroke="#1e293b" stroke-width="1" />
  <path d="M 200 0 L 200 260 M 400 0 L 400 260 M 600 0 L 600 260 M 800 0 L 800 260" stroke="#1e293b" stroke-width="1" />

  <!-- Logo Mark -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <rect width="90" height="90" rx="20" fill="#1e1e38" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Cloud & Hammer/Forge Glyph -->
    <path d="M 30 55 C 24 55 20 50 20 44 C 20 38 24 34 30 34 C 32 26 39 20 48 20 C 58 20 66 28 67 38 C 72 39 76 43 76 48 C 76 54 71 55 66 55 Z" fill="url(#gcpGlow)" opacity="0.9" />
    <polygon points="45,45 68,68 60,76 37,53" fill="#ffffff" />
    <polygon points="62,70 70,62 76,68 68,76" fill="#38bdf8" />
  </g>

  <!-- Title & Subtitle -->
  <text x="180" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">gcp-tf-forge</text>
  <text x="460" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#38bdf8">v0.1.0</text>
  
  <text x="180" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Enterprise GCP Infrastructure Importer &amp; Modernizer for Terraform
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 165)">
    <!-- Pill 1 -->
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Modules-First</text>

    <!-- Pill 2 -->
    <rect x="185" width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="267" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ Zero-Trust Safe</text>

    <!-- Pill 3 -->
    <rect x="365" width="195" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="462" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">📦 *.auto.tfvars Isolated</text>

    <!-- Pill 4 -->
    <rect x="575" width="170" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="660" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🧹 Auto-Clean Imports</text>
  </g>
</svg>
